name: Reporte de bug
description: El pipeline no procesa o no persiste como se documenta
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: dropdown
    id: componente
    attributes:
      label: Componente
      options:
        - Kafka / tópico
        - Processor / batching
        - PostgreSQL / esquema
        - Productor de demo
        - Docker / CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión / commit
      placeholder: "v1.0.0 o git rev-parse --short HEAD"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail=200 processor kafka postgres`"
      render: shell
