name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python 3.12
      - name: Instalar proyecto y dev
        run: uv pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Mypy
        run: .venv/bin/mypy app.py kpi.py scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python ${{ matrix.python-version }}
      - name: Instalar proyecto y dev
        run: uv pip install -e ".[dev]"
      - name: Pytest con cobertura
        run: .venv/bin/pytest -q --cov=app --cov=kpi --cov=scripts --cov-report=term-missing --cov-fail-under=65

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - run: uv pip install pip-audit
      - run: .venv/bin/pip-audit --skip-editable
