# Pipeline KPI: Kafka (KRaft) + PostgreSQL + procesador
# Demo:  docker compose up -d --build
#        docker compose --profile demo run --rm producer
#        query en PostgreSQL: SELECT * FROM test.kpis;
# Tools: docker compose --profile tools up -d cloudbeaver

volumes:
  kafka_data:
  postgres_data:
  cloudbeaver_data:

networks:
  backend_net:
    driver: bridge

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kpi-kafka
    networks:
      - backend_net
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kpi-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic ${KAFKA_TOPIC:-test}
        --partitions 1 --replication-factor 1
    restart: "no"

  postgres:
    image: postgres:16
    container_name: kpi-postgres
    networks:
      - backend_net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgresdb}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgresdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  processor:
    build: .
    image: ghcr.io/bi0punk/kpi-datapipeline:latest
    container_name: kpi-processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - backend_net
    environment:
      DB_NAME: ${DB_NAME:-postgresdb}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: "5432"
      DB_TABLE: ${DB_TABLE:-test.kpis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-test}
      KAFKA_GROUP: ${KAFKA_GROUP:-kpi-processor}
      KPI_FLUSH_INTERVAL: ${KPI_FLUSH_INTERVAL:-2.0}
      KPI_FLUSH_MAX_ROWS: ${KPI_FLUSH_MAX_ROWS:-500}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  producer:
    profiles: ["demo"]
    build: .
    image: ghcr.io/bi0punk/kpi-datapipeline:latest
    container_name: kpi-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend_net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-test}
    command: ["python", "scripts/produce_demo.py", "--count", "200", "--interval", "0.01"]

  cloudbeaver:
    profiles: ["tools"]
    image: dbeaver/cloudbeaver:23.0.0
    container_name: kpi-cloudbeaver
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
    ports:
      - "8080:8978"
    environment:
      CB_SERVER_NAME: CloudBeaver
      CB_SERVER_URL: http://localhost:8080
      CB_ADMIN_NAME: admin
      CB_ADMIN_PASSWORD: ${CB_ADMIN_PASSWORD:-admin123}
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    restart: unless-stopped
