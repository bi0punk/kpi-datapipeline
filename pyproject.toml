[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline_kpi"
version = "1.0.0"
description = "Streaming data pipeline that reads JSON messages from Apache Kafka, computes KPIs, and stores aggregated counts in PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "kafka-python>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
